server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets but allow immediate file changes
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|mp4|pdf)$ {
        expires 5m;
        add_header Cache-Control "public, no-transform";
    }
}
